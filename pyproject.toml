[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "authy-local"
version = "1.1.0"
description = "Local terminal companion for explicitly scoped OTP access and enrollment"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "textual>=0.80.0",
]
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.14",
    "Private :: Do Not Upload",
]

[project.scripts]
otp-local = "authy_local.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"authy_local.guides" = ["*.md"]

[tool.ruff]
target-version = "py314"
line-length = 100
exclude = [".agents", ".venv", "to-dos"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.format]
exclude = ["tests/e2e/**"]

[tool.coverage.run]
branch = true
source = ["authy_local"]

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
cache_dir = "/tmp/pytest_cache"
addopts = "-v --tb=short"


