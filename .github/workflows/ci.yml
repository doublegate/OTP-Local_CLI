name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Lint, Test, and Quality Gates
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qrencode fzf libpam0g-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Install Node.js dependencies
        run: |
          npm ci --ignore-scripts

      - name: Verify bundled operator guides
        run: |
          python scripts/bundle_guides.py --check

      - name: Run documentation link and task validation
        run: |
          python scripts/check_docs.py

      - name: Run ruff lint check
        run: |
          python -m ruff check src tests scripts

      - name: Run ruff format check
        run: |
          python -m ruff format --check src tests scripts

      - name: Run markdownlint
        run: |
          npx markdownlint-cli2

      - name: Run shellcheck
        run: |
          shellcheck scripts/check.sh

      - name: Build package distribution
        run: |
          python -m build --no-isolation
          (cd dist && sha256sum authy_local-2.0.1* > SHA256SUMS && sha256sum -c SHA256SUMS --strict)
          python -m pip wheel --wheel-dir dist/wheels --quiet "textual>=0.80.0" "fido2>=2.0.0" "pluggy>=1.0.0"

      - name: Run test suite with coverage
        run: |
          python -m coverage run -m pytest tests -v
          python -m coverage report --fail-under=75
          python -m coverage report --include='*/models.py,*/backends/onepassword.py' --fail-under=100

      - name: Verify package smoke test
        run: |
          python scripts/smoke_package.py

      - name: Verify package distribution checksums
        run: |
          cd dist && sha256sum -c SHA256SUMS --strict
