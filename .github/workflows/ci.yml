name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Lint, Test, and Quality Gates
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qrencode fzf

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install --no-build-isolation --no-deps -e .

      - name: Install Node.js dependencies
        run: |
          npm ci --ignore-scripts

      - name: Verify bundled operator guides
        run: |
          python scripts/bundle_guides.py --check

      - name: Run documentation link and task validation
        run: |
          python scripts/check_docs.py

      - name: Run ruff lint check
        run: |
          ruff check src tests scripts

      - name: Run ruff format check
        run: |
          ruff format --check src tests scripts

      - name: Run markdownlint
        run: |
          npx markdownlint-cli2

      - name: Run test suite
        run: |
          pytest tests -v

      - name: Verify build and smoke test
        run: |
          python -m build --no-isolation
          python scripts/smoke_package.py
